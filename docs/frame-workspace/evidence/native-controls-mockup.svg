<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440">
<defs>
 <style>text{font-family:-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;fill:#edf0f5;font-size:13px}.muted{fill:#aab0ba}.small{font-size:12px}.title{font-size:19px;font-weight:700}.label{font-weight:600}.field{fill:#1c2027;stroke:#3b414c}.button{fill:#373d47;stroke:#454d5b}.blue{fill:#436ada;stroke:#6886ed}.card{fill:#252a33;stroke:#414957}.green{fill:#8aca69}</style>
 <g id="base">
  <rect class="card" width="520" height="264" rx="10"/>
  <text x="16" y="30" class="label" letter-spacing="1.6">MAC IN THE HEADSET</text><text x="195" y="30" class="muted small">1 showing</text>
  <rect x="392" y="13" width="111" height="30" rx="4" class="field"/><text x="406" y="33">Sharp</text><text x="483" y="33" class="muted">⌄</text>
  <text x="16" y="75" class="label">Workspace</text><text x="95" y="75" class="muted small">Desktop</text>
  <rect x="146" y="55" width="164" height="32" rx="4" class="field"/><text x="156" y="76" class="small">9:8 · 2880 × 2560</text><text x="292" y="75" class="muted">⌄</text>
  <text x="322" y="75" class="muted small">Scale</text><rect x="358" y="55" width="55" height="32" rx="4" class="field"/><text x="370" y="76">1×</text>
  <rect x="422" y="55" width="82" height="32" rx="4" class="blue"/><text x="433" y="76" class="small label">Show again</text>
 </g>
 <g id="stop"><rect width="120" height="32" rx="4" class="button"/><text x="10" y="21" class="small">Stop Workspace</text></g>
 <g id="width"><text x="0" y="21" class="muted small">Width</text><rect x="42" width="28" height="32" rx="4" class="button"/><text x="52" y="21">−</text><rect x="73" width="49" height="32" rx="4" class="field"/><text x="82" y="21">2.4 m</text><rect x="125" width="28" height="32" rx="4" class="button"/><text x="135" y="21">+</text></g>
 <g id="distance"><text x="0" y="21" class="muted small">Distance</text><rect x="57" width="28" height="32" rx="4" class="button"/><text x="67" y="21">−</text><rect x="88" width="49" height="32" rx="4" class="field"/><text x="97" y="21">2.0 m</text><rect x="140" width="28" height="32" rx="4" class="button"/><text x="150" y="21">+</text></g>
 <g id="status"><text class="small green">Streaming</text><text x="62" class="small">· 2880 × 2560 · Sharp · 30 fps target</text><text y="21" class="small muted">Width and distance update the current panel immediately.</text><text y="40" class="small muted">Show again centers it ahead of the current headset direction.</text></g>
</defs>
<rect width="1120" height="440" fill="#171b22"/>
<text x="24" y="33" class="title">Native placement controls — review mockup</text>
<text x="24" y="58" class="muted">Two compact variations using existing control styling. No new image assets required.</text>
<text x="24" y="97" class="label">A · Inline controls</text><text x="576" y="97" class="label">B · Expandable placement</text>
<g transform="translate(24 111)"><use href="#base"/><g transform="translate(16 103)"><use href="#stop"/></g><g transform="translate(148 103)"><use href="#width"/></g><g transform="translate(316 103)"><use href="#distance"/></g><g transform="translate(16 170)"><use href="#status"/></g></g>
<g transform="translate(576 111)"><use href="#base"/><g transform="translate(16 103)"><use href="#stop"/></g><rect x="148" y="103" width="112" height="32" rx="4" class="button"/><text x="161" y="124" class="small">Placement ⌃</text><g transform="translate(16 145)"><use href="#width"/></g><g transform="translate(185 145)"><use href="#distance"/></g><g transform="translate(16 206)"><use href="#status"/></g></g>
<text x="24" y="403" class="small muted">A keeps placement available in one row.</text><text x="576" y="403" class="small muted">B hides the adjustment row when Placement is collapsed.</text>
<text x="24" y="426" class="small muted">Design only. Production controls await approval under the working agreement.</text>
</svg>